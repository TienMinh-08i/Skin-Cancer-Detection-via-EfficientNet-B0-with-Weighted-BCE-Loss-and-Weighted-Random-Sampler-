seed: 42
device: cuda
project_name: skin-cancer-classification

dataset:
  dataset_root: /path/to/dataset/root
  csv_path: /path/to/metadata.csv
  image_dir: /path/to/images
  image_size: 224
  target_col: target
  image_id_cols:
    - image_name
  max_samples: null
  cv_folds: 5
  random_state: 42

augmentation:
  rotation_degrees: 25.0
  horizontal_flip_p: 0.5
  vertical_flip_p: 0.5
  color_jitter_brightness: 0.15
  color_jitter_contrast: 0.15
  color_jitter_saturation: 0.1
  color_jitter_hue: 0.02

imbalance:
  method: weighted_sampler
  weighted_sampler_enabled: true
  smote_enabled: false
  smote_k_neighbors: 5
  mixup_enabled: false
  mixup_alpha: 1.0
  cutmix_enabled: false
  cutmix_alpha: 1.0

loss:
  loss_type: weighted_bce
  focal_alpha: 0.25
  focal_gamma: 2.0
  cb_focal_beta: 0.9999

model:
  model_name: efficientnet_b0
  pretrained: true
  num_classes: 1

optimizer:
  optimizer_type: adamw
  learning_rate: 0.0003
  weight_decay: 0.0001
  momentum: 0.9

scheduler:
  scheduler_type: cosine
  cosine_t_max: 20
  step_gamma: 0.1
  step_step_size: 10

training:
  batch_size: 32
  num_epochs: 20
  num_workers: 4
  pin_memory: true
  early_stopping_patience: 5
  early_stopping_metric: auprc
  use_amp: true
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0

threshold_optimization:
  enabled: true
  methods:
    - youden
    - f1
    - clinical
  clinical_fn_cost_ratio: 1.0

evaluation:
  threshold: 0.5
  save_predictions: true
  compute_gradcam: true
  compute_error_analysis: true
  error_analysis_n_samples: 20

outputs:
  root_dir: outputs
  checkpoints_dir: checkpoints
  logs_dir: logs
  figures_dir: figures
  results_dir: results
